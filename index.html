<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendário · Agenda de conteúdo</title>
  <meta name="description" content="Agenda diária de postagens, captações e reuniões por empresa.">
  <meta name="theme-color" content="#F3F3F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calendário">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="media/intro-poster.jpg" as="image">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <video id="intro-video" src="media/intro.mp4" poster="media/intro-poster.jpg" muted autoplay playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  </div>
  <script src="js/intro.js"></script>
  <div id="app">
    <div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><p>Carregando…</p></div>
  </div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para usar a agenda.</noscript>
  <script>
    /* Proteção: se o app não abrir, mostra o motivo e um botão para recarregar */
    (function () {
      var lastErr = '';
      window.addEventListener('error', function (e) { lastErr = (e.message || '') + ' ' + (e.filename || '').split('/').pop(); });
      window.addEventListener('unhandledrejection', function (e) { lastErr = String(e.reason && (e.reason.message || e.reason)); });
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || document.getElementById('view') || app.querySelector('[data-login],[data-retry]')) return;
        app.innerHTML = '<div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><h2>O app demorou para abrir</h2><p>Toque para recarregar.</p><button class="btn btn--primary" onclick="location.reload()">Recarregar</button><small class="muted"></small></div>';
        app.querySelector('small').textContent = lastErr ? 'Detalhe: ' + lastErr : '';
      }, 20000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
