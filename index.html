  <div id="intro" class="intro" aria-hidden="true"></div>
  <script>
/* Abertura: motion design em js/abertura.js (o Sininho vira o ícone e a marca se forma). Toque para pular. */
(function () {
  var intro = document.getElementById('intro');
  var root = document.documentElement;
  if (!intro) return;
  var AWAY_MS = 1800000, leaving = false, hiddenAt = 0, run = 0, stopFn = null, timers = [];
  var personalMode = false;
  try {
    var st = JSON.parse(localStorage.getItem('pauta.ui') || '{}');
    if (/[?&]modo=pessoal/.test(location.search)) { st.space = 'personal'; localStorage.setItem('pauta.ui', JSON.stringify(st)); }
    else if (/[?&]modo=trabalho/.test(location.search)) { st.space = 'work'; localStorage.setItem('pauta.ui', JSON.stringify(st)); }
    personalMode = st.space === 'personal' || /^#\/p\//.test(location.hash);
  } catch (e) {}
  if (personalMode) root.setAttribute('data-space', 'personal');
  var isClient = function () { return root.getAttribute('data-space') === 'personal' || /^#\/(c|v|e|d|p)\//.test(location.hash); };
  var M = null, ab = null;
  var mod = import('./js/abertura.js').then(function (m) { M = m; ab = m.mountIntro(intro); return m.ready().then(function () { return m; }); });
  var rigReady = mod.then(function () {
    return new Promise(function (res) { var t0 = Date.now(); (function w() { var el = intro.querySelector('[data-snh]'); if (el && el._rig && !el._rig.pending) return res(true); if (Date.now() - t0 > 2500) return res(false); setTimeout(w, 25); })(); });
  }).catch(function () { return false; });
  function finish() {
    if (leaving) return;
    leaving = true; timers.forEach(clearTimeout); timers = [];
    if (stopFn) stopFn();
    intro.classList.add('is-leaving');
    root.classList.add('intro-done');
    var light = '#FFF6EE';
    var dark = '#0A0A0A';
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', /dark/.test(m.getAttribute('media') || '') ? dark : light); });
    timers.push(setTimeout(function () { intro.classList.add('is-gone'); }, 550));
  }
  function play() {
    timers.forEach(clearTimeout); timers = []; leaving = false; var my = ++run;
    intro.classList.remove('is-gone', 'is-leaving');
    root.classList.remove('intro-done');
    timers.push(setTimeout(finish, 6000)); // segurança
    rigReady.then(function (ok) {
      if (my !== run || leaving) return;
      if (!ok || !M) return finish();
      if (stopFn) stopFn();
      // 1ª vez: usa a abertura já montada (montar de novo fazia o boneco piscar duas vezes antes de começar)
      if (!ab || stopFn) ab = M.mountIntro(intro);
      var w = function () { var el = intro.querySelector('[data-snh]'); if (el && el._rig && !el._rig.pending) { stopFn = M.runIntro(ab, { onEnd: function () { timers.push(setTimeout(finish, 250)); } }); } else setTimeout(w, 16); };
      w();
    });
  }
  intro.addEventListener('click', finish);
  // abriu direto numa tela (link com #/…, ex.: tocou numa notificação): vai direto, sem a abertura
  var deTela = /^#\/./.test(location.hash) || /[?&]src=notif/.test(location.search);
  if (isClient() || deTela) { intro.classList.add('is-gone'); root.classList.add('intro-done'); } else play();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && !isClient()) {
      // voltou pela notificação (o app recebe o aviso logo em seguida): não toca a abertura
      setTimeout(function () { if (!(window.__avisoAt && Date.now() - window.__avisoAt < 3000)) play(); }, 250);
    }
  });
  window.PautaIntro = { play: play, finish: finish };
})();
  </script>

  <script>
    /* Carrega o app e, se algo falhar, mostra o motivo exato e um botão para limpar e recarregar */
    (function () {
      var lastErr = '';
      function fail(detail) {
        if (!detail && window.__calStarted) return; // o app carregou: quem cuida de erros agora é ele
        var app = document.getElementById('app');
        if (!app || document.getElementById('view') || app.querySelector('[data-login],[data-retry]')) return;
        var intro = document.getElementById('intro');
        if (intro) intro.className = 'intro is-gone';
        document.documentElement.classList.add('intro-done');
        app.innerHTML = '<div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><h2>O app não abriu</h2>' +
          '<p>Toque em “Limpar e recarregar”.</p><button class="btn btn--primary" id="fix-btn">Limpar e recarregar</button>' +
          '<small class="muted" id="fix-detail"></small></div>';
        document.getElementById('fix-detail').textContent = 'Detalhe: ' + (detail || lastErr || 'sem resposta');
        document.getElementById('fix-btn').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
        };
      }
      window.__pautaFail = fail;
      // erros de arquivos que não carregam (capturados antes de chegar à página)
      window.addEventListener('error', function (e) {
        var t = e.target;
        lastErr = t && t !== window && (t.src || t.href) ? 'não carregou ' + String(t.src || t.href).split('/').slice(-2).join('/') : (e.message || '') + ' ' + String(e.filename || '').split('/').pop();
      }, true);
      window.addEventListener('unhandledrejection', function (e) { lastErr = String(e.reason && (e.reason.message || e.reason)); });
      var APP = /*APP*/'./dist/a-4QORO7DR.js'/*APP*/;
      window.__appEntry = APP;
      // quem já usava o app antes de existir o número de versão vê as "Novidades" da 2.0.0 (quem acabou de instalar, não)
      try { window.__firstRun = !localStorage.getItem('pauta.ui') && !localStorage.getItem('lembra.ver'); } catch (e) { window.__firstRun = true; }
      import(APP).catch(function (e) { fail(String(e && (e.message || e))); });
      setTimeout(function () { fail(''); }, 20000);
      // Atualiza sozinho: ao VOLTAR para o app, confere se há versão nova e recarrega UMA vez por versão.
      // Nunca recarrega enquanto a pessoa está usando (digitando, com tela aberta) e nunca em sequência.
      var lastCheck = 0;
      function checkUpdate() {
        if (window.__verWatch) return; // o app já confere a versão (js/version.js)
        if (Date.now() - lastCheck < 60000) return;
        lastCheck = Date.now();
        fetch('index.html?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
          var m = /\/\*APP\*\/'([^']+)'/.exec(t);
          if (!m || m[1] === APP) return;
          var tried = '';
          try { tried = sessionStorage.getItem('cal.updTried') || ''; } catch (e) {}
          if (tried === m[1]) return; // já tentou esta versão: não insiste (evita ficar recarregando)
          var busy = document.querySelector('.sheet-wrap, .ficha, .paywall, .ob, .termsgate, .guide, .spaceveil') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
          if (busy) return;
          try { sessionStorage.setItem('cal.updTried', m[1]); } catch (e) {}
          // endereço novo: o iPhone não reaproveita a página antiga guardada
          location.replace(location.pathname + '?u=' + encodeURIComponent(m[1].replace(/\W/g, '')) + location.hash);
        }).catch(function () {});
      }
      document.addEventListener('visibilitychange', function () { if (!document.hidden) setTimeout(checkUpdate, 1500); });
    })();
  </script>
