<body>
  <div id="intro" class="intro" aria-hidden="true"><canvas id="intro-canvas"></canvas></div>
  <script>
/* Abertura animada (sem som), desenhada quadro a quadro pelo próprio app.
   Funciona sempre, inclusive no Modo Pouca Energia do iPhone (que bloqueia vídeos e
   segura animações), e os quadros ficam guardados no celular: abre na hora, sem internet.
   Para não pesar na memória, só os próximos quadros são preparados enquanto toca. */
(function () {
  var intro = document.getElementById('intro');
  var canvas = document.getElementById('intro-canvas');
  var root = document.documentElement;
  if (!intro || !canvas) return;
  var FRAMES = 67, FPS = 24, AHEAD = 6;
  var URLS = [];
  for (var i = 1; i <= FRAMES; i++) URLS.push('media/intro5/f' + ('00' + i).slice(-3) + '.webp');
  var AWAY_MS = 30000; // tempo fora do app para repetir a abertura
  var leaving = false, timers = [], hiddenAt = 0, run = 0, blobs = null, loading = null;
  // ícone "Pessoal" da Tela de Início (?modo=pessoal) ou último modo usado: abre direto no Pessoal
  var personalMode = false;
  try {
    var st = JSON.parse(localStorage.getItem('pauta.ui') || '{}');
    if (/[?&]modo=pessoal/.test(location.search)) { st.space = 'personal'; localStorage.setItem('pauta.ui', JSON.stringify(st)); }
    else if (/[?&]modo=trabalho/.test(location.search)) { st.space = 'work'; localStorage.setItem('pauta.ui', JSON.stringify(st)); }
    personalMode = st.space === 'personal' || /^#\/p\//.test(location.hash);
  } catch (e) {}
  if (personalMode) root.setAttribute('data-space', 'personal');
  var isClient = function () { return root.getAttribute('data-space') === 'personal' || /^#\/(c|v|e|d|p)\//.test(location.hash); };
  var clear = function () { timers.forEach(clearTimeout); timers = []; };

  function loadAll() {
    if (blobs) return Promise.resolve(blobs);
    if (!loading) {
      loading = Promise.all(URLS.map(function (u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return r.blob(); }); }))
        .then(function (b) { blobs = b; return b; })
        .catch(function (e) { loading = null; throw e; });
    }
    return loading;
  }

  function finish() {
    if (leaving) return;
    leaving = true;
    run++;
    clear();
    intro.classList.add('is-leaving');
    root.classList.add('intro-done');
    // a barra do topo (hora/bateria) volta para a cor do app
    var light = root.getAttribute('data-space') === 'personal' ? '#F7F3FA' : '#F4F4F6';
    var dark = root.getAttribute('data-space') === 'personal' ? '#0E0A13' : '#000000';
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', /dark/.test(m.getAttribute('media') || '') ? dark : light); });
    timers.push(setTimeout(function () { intro.classList.add('is-gone'); }, 800));
  }

  function draw(ctx, bmp) {
    var cw = canvas.width, ch = canvas.height;
    var s = Math.max(cw / bmp.width, ch / bmp.height);
    var w = bmp.width * s, h = bmp.height * s;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(bmp, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function animate(myRun) {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    var ctx = canvas.getContext('2d');
    var decode = function (i) { return createImageBitmap(blobs[i]); };
    var queue = [];
    for (var k = 0; k < AHEAD && k < FRAMES; k++) queue[k] = decode(k);
    var start = null, last = -1;
    function step(now) {
      if (myRun !== run) return;
      if (start === null) start = now;
      var idx = Math.min(FRAMES - 1, Math.floor(((now - start) / 1000) * FPS));
      if (((now - start) / 1000) * FPS >= FRAMES + Math.round(FPS * 0.5)) finish(); // mostra a logo completa por meio segundo e some
      // desenha cada quadro uma única vez (a tela atualiza mais rápido que a animação)
      if (idx !== last) {
        last = idx;
        var p = queue[idx] || (queue[idx] = decode(idx));
        queue[idx] = null;
        p.then(function (bmp) {
          if (myRun === run) draw(ctx, bmp);
          if (bmp.close) bmp.close();
        }).catch(function () {});
        // libera quadros que ficaram para trás (se o celular atrasou) e prepara os próximos
        for (var j = 0; j < idx; j++) if (queue[j]) { queue[j].then(function (b) { if (b.close) b.close(); }).catch(function () {}); queue[j] = null; }
        for (var a = idx + 1; a <= idx + AHEAD && a < FRAMES; a++) if (!queue[a]) queue[a] = decode(a);
      }
      if (((now - start) / 1000) * FPS < FRAMES + FPS) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function play() {
    clear();
    leaving = false;
    var myRun = ++run;
    intro.classList.remove('is-gone', 'is-leaving');
    root.classList.remove('intro-done');
    var ctx = canvas.getContext('2d');
    ctx && ctx.clearRect(0, 0, canvas.width, canvas.height);
    // primeira vez sem os quadros no celular: mostra a capa e segue (eles baixam por trás)
    timers.push(setTimeout(function () { if (myRun === run && !blobs) finish(); }, 2500));
    timers.push(setTimeout(finish, Math.ceil(FRAMES / FPS * 1000) + 3500)); // segurança: nunca prende a pessoa na abertura
    loadAll().then(function () {
      if (myRun !== run || leaving) return;
      if (typeof createImageBitmap !== 'function') return finish();
      animate(myRun);
    }).catch(function () { if (myRun === run) finish(); });
  }

  intro.addEventListener('click', finish); // toque para pular

  if (isClient()) {
    intro.classList.add('is-gone');
    root.classList.add('intro-done');
  } else {
    play();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      hiddenAt = Date.now();
    } else if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && !isClient()) {
      play();
    }
  });
  window.PautaIntro = { play: play, finish: finish };
})();
  </script>

  <script>
    /* Carrega o app e, se algo falhar, mostra o motivo exato e um botão para limpar e recarregar */
    (function () {
      var lastErr = '';
      function fail(detail) {
        if (!detail && window.__calStarted) return; // o app carregou: quem cuida de erros agora é ele
        var app = document.getElementById('app');
        if (!app || document.getElementById('view') || app.querySelector('[data-login],[data-retry]')) return;
        var intro = document.getElementById('intro');
        if (intro) intro.className = 'intro is-gone';
        document.documentElement.classList.add('intro-done');
        app.innerHTML = '<div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><h2>O app não abriu</h2>' +
          '<p>Toque em “Limpar e recarregar”.</p><button class="btn btn--primary" id="fix-btn">Limpar e recarregar</button>' +
          '<small class="muted" id="fix-detail"></small></div>';
        document.getElementById('fix-detail').textContent = 'Detalhe: ' + (detail || lastErr || 'sem resposta');
        document.getElementById('fix-btn').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
        };
      }
      window.__pautaFail = fail;
      // erros de arquivos que não carregam (capturados antes de chegar à página)
      window.addEventListener('error', function (e) {
        var t = e.target;
        lastErr = t && t !== window && (t.src || t.href) ? 'não carregou ' + String(t.src || t.href).split('/').slice(-2).join('/') : (e.message || '') + ' ' + String(e.filename || '').split('/').pop();
      }, true);
      window.addEventListener('unhandledrejection', function (e) { lastErr = String(e.reason && (e.reason.message || e.reason)); });
      var APP = /*APP*/'./dist/a-OK2EI24V.js'/*APP*/;
      window.__appEntry = APP;
      // quem já usava o app antes de existir o número de versão vê as "Novidades" da 2.0.0 (quem acabou de instalar, não)
      try { window.__firstRun = !localStorage.getItem('pauta.ui') && !localStorage.getItem('lembra.ver'); } catch (e) { window.__firstRun = true; }
      import(APP).catch(function (e) { fail(String(e && (e.message || e))); });
      setTimeout(function () { fail(''); }, 20000);
      // Atualiza sozinho: ao VOLTAR para o app, confere se há versão nova e recarrega UMA vez por versão.
      // Nunca recarrega enquanto a pessoa está usando (digitando, com tela aberta) e nunca em sequência.
      var lastCheck = 0;
      function checkUpdate() {
        if (window.__verWatch) return; // o app já confere a versão (js/version.js)
        if (Date.now() - lastCheck < 60000) return;
        lastCheck = Date.now();
        fetch('index.html?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
          var m = /\/\*APP\*\/'([^']+)'/.exec(t);
          if (!m || m[1] === APP) return;
          var tried = '';
          try { tried = sessionStorage.getItem('cal.updTried') || ''; } catch (e) {}
          if (tried === m[1]) return; // já tentou esta versão: não insiste (evita ficar recarregando)
          var busy = document.querySelector('.sheet-wrap, .ficha, .paywall, .ob, .termsgate, .guide, .spaceveil') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
          if (busy) return;
          try { sessionStorage.setItem('cal.updTried', m[1]); } catch (e) {}
          // endereço novo: o iPhone não reaproveita a página antiga guardada
          location.replace(location.pathname + '?u=' + encodeURIComponent(m[1].replace(/\W/g, '')) + location.hash);
        }).catch(function () {});
      }
      document.addEventListener('visibilitychange', function () { if (!document.hidden) setTimeout(checkUpdate, 1500); });
    })();
  </script>
