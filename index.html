<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendário · Agenda de conteúdo</title>
  <meta name="description" content="Agenda diária de postagens, captações e reuniões por empresa.">
  <meta name="theme-color" content="#F3F3F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calendário">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="media/intro-poster.jpg" as="image">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <video id="intro-video" src="media/intro.mp4" poster="media/intro-poster.jpg" muted autoplay playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  </div>
  <script src="js/intro.js"></script>
  <div id="app">
    <div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><p>Carregando…</p></div>
  </div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para usar a agenda.</noscript>
  <script>
    /* Carrega o app e, se algo falhar, mostra o motivo exato e um botão para limpar e recarregar */
    (function () {
      var lastErr = '';
      function fail(detail) {
        var app = document.getElementById('app');
        if (!app || document.getElementById('view') || app.querySelector('[data-login],[data-retry]')) return;
        var intro = document.getElementById('intro');
        if (intro) intro.className = 'intro is-gone';
        document.documentElement.classList.add('intro-done');
        app.innerHTML = '<div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><h2>O app não abriu</h2>' +
          '<p>Toque em “Limpar e recarregar”.</p><button class="btn btn--primary" id="fix-btn">Limpar e recarregar</button>' +
          '<small class="muted" id="fix-detail"></small></div>';
        document.getElementById('fix-detail').textContent = 'Detalhe: ' + (detail || lastErr || 'sem resposta');
        document.getElementById('fix-btn').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
        };
      }
      window.__pautaFail = fail;
      // erros de arquivos que não carregam (capturados antes de chegar à página)
      window.addEventListener('error', function (e) {
        var t = e.target;
        lastErr = t && t !== window && (t.src || t.href) ? 'não carregou ' + String(t.src || t.href).split('/').slice(-2).join('/') : (e.message || '') + ' ' + String(e.filename || '').split('/').pop();
      }, true);
      window.addEventListener('unhandledrejection', function (e) { lastErr = String(e.reason && (e.reason.message || e.reason)); });
      // descobre qual arquivo falhou (testa um por um)
      var FILES = ['config.js', 'functions/reminder-rules.js', 'js/utils.js', 'js/constants.js', 'js/icons.js', 'js/sanitize.js', 'js/share.js', 'js/store.js', 'js/ui.js',
        'js/components.js', 'js/planner.js', 'js/insights.js', 'js/ics.js', 'js/avisos.js', 'js/claude-link.js', 'js/views/client.js', 'js/views/companies.js',
        'js/views/event.js', 'js/views/calendar.js', 'js/views/settings.js', 'js/views/assistant.js', 'js/views/onboarding.js'];
      function diagnose(first) {
        var i = 0;
        (function next() {
          if (i >= FILES.length) return fail(first);
          var f = FILES[i++];
          import('./' + f).then(next, function (e) { fail(f + ': ' + String(e && (e.message || e))); });
        })();
      }
      import('./js/app.js').catch(function (e) { diagnose(String(e && (e.message || e))); });
      setTimeout(function () { fail(''); }, 20000);
    })();
  </script>
</body>
</html>
