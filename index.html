<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendário · Agenda de conteúdo</title>
  <meta name="description" content="Agenda diária de postagens, captações e reuniões por empresa.">
  <meta name="theme-color" content="#F3F3F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calendário">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="media/intro-poster.jpg" as="image">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <video id="intro-video" src="media/intro.mp4" poster="media/intro-poster.jpg" muted autoplay playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  </div>
  <script>
/* Abertura com vídeo (sem som). Aparece ao abrir o app e ao voltar para ele
   depois de um tempo fora. Termina com uma transição suave para a agenda. */
(function () {
  var intro = document.getElementById('intro');
  var video = document.getElementById('intro-video');
  var root = document.documentElement;
  if (!intro || !video) return;
  var AWAY_MS = 30000; // tempo fora do app para repetir a abertura
  var leaving = false, timer = null, hiddenAt = 0;
  var isClient = function () { return /^#\/(c|v)\//.test(location.hash); };

  function finish() {
    if (leaving) return;
    leaving = true;
    clearTimeout(timer);
    intro.classList.add('is-leaving');
    root.classList.add('intro-done');
    setTimeout(function () {
      intro.classList.add('is-gone');
      try { video.pause(); } catch (e) { /* ok */ }
    }, 800);
  }

  function play() {
    leaving = false;
    intro.classList.remove('is-gone', 'is-leaving');
    root.classList.remove('intro-done');
    try { video.currentTime = 0; } catch (e) { /* ok */ }
    clearTimeout(timer);
    timer = setTimeout(finish, 4500); // segurança: nunca prende a pessoa na abertura
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () {
        // Modo Pouca Energia do iPhone bloqueia vídeo automático: mostra a imagem e segue
        clearTimeout(timer);
        timer = setTimeout(finish, 1100);
      });
    }
  }

  // começa a transição um pouco antes do fim, para emendar sem "pulo"
  video.addEventListener('timeupdate', function () {
    if (video.duration && video.currentTime >= video.duration - 0.35) finish();
  });
  video.addEventListener('ended', finish);
  video.addEventListener('error', function () { setTimeout(finish, 600); });
  intro.addEventListener('click', finish); // toque para pular

  if (isClient()) {
    intro.classList.add('is-gone');
    root.classList.add('intro-done');
  } else {
    play();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      hiddenAt = Date.now();
    } else if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && !isClient()) {
      play();
    }
  });
  window.PautaIntro = { play: play, finish: finish };
})();
  </script>
  <div id="app">
    <div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><p>Carregando…</p></div>
  </div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para usar a agenda.</noscript>
  <script>
    /* Carrega o app e, se algo falhar, mostra o motivo exato e um botão para limpar e recarregar */
    (function () {
      var lastErr = '';
      function fail(detail) {
        var app = document.getElementById('app');
        if (!app || document.getElementById('view') || app.querySelector('[data-login],[data-retry]')) return;
        var intro = document.getElementById('intro');
        if (intro) intro.className = 'intro is-gone';
        document.documentElement.classList.add('intro-done');
        app.innerHTML = '<div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><h2>O app não abriu</h2>' +
          '<p>Toque em “Limpar e recarregar”.</p><button class="btn btn--primary" id="fix-btn">Limpar e recarregar</button>' +
          '<small class="muted" id="fix-detail"></small></div>';
        document.getElementById('fix-detail').textContent = 'Detalhe: ' + (detail || lastErr || 'sem resposta');
        document.getElementById('fix-btn').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
        };
      }
      window.__pautaFail = fail;
      // erros de arquivos que não carregam (capturados antes de chegar à página)
      window.addEventListener('error', function (e) {
        var t = e.target;
        lastErr = t && t !== window && (t.src || t.href) ? 'não carregou ' + String(t.src || t.href).split('/').slice(-2).join('/') : (e.message || '') + ' ' + String(e.filename || '').split('/').pop();
      }, true);
      window.addEventListener('unhandledrejection', function (e) { lastErr = String(e.reason && (e.reason.message || e.reason)); });
      var APP = /*APP*/'./dist/a-OBDJSOW4.js'/*APP*/;
      import(APP).catch(function (e) { fail(String(e && (e.message || e))); });
      setTimeout(function () { fail(''); }, 20000);
    })();
  </script>
</body>
</html>
