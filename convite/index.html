<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Convite para o Lembra</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Você foi convidado para uma agenda no Lembra">
<meta property="og:description" content="Toque para entrar. O convite é pessoal e vale para uma pessoa só.">
<meta property="og:image" content="https://icarlxs-code.github.io/Calend-rio-/media/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F4F6">
<link rel="icon" href="../icons/favicon-64.png">
<style>:root{--bg:#F2F2F7;--card:#fff;--text:#121216;--muted:#5b5b66;--line:rgba(0,0,0,.08);--accent:#0A84FF;color-scheme:light dark}@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#16161A;--text:#F4F4F6;--muted:#a1a1ab;--line:rgba(255,255,255,.1)}}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px 48px}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 8px}h2{font-size:19px;margin:28px 0 6px}h3{font-size:16px;margin:18px 0 4px}p,li{color:var(--muted)}b,strong{color:var(--text)}a{color:var(--accent)}ul{padding-left:20px}.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06)}.center{text-align:center}.center img.logo{width:96px;height:96px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.15)}.btn{display:block;width:100%;padding:16px;border-radius:16px;border:0;background:var(--text);color:var(--bg);font:600 17px/1 inherit;text-align:center;text-decoration:none;margin-top:16px}.small{font-size:13px}.ok{width:64px;height:64px;border-radius:50%;background:#34C759;color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:34px}.toc{columns:2;font-size:14px}@media(max-width:520px){.toc{columns:1}}.brandc{display:flex;justify-content:center;margin:8px 0 14px}</style></head>
<body><main class="center">
  <div class="brandc"><picture><source srcset="../media/marca/completa-branco.png" media="(prefers-color-scheme: dark)"><img class="" src="../media/marca/completa-preto.png" alt="Lembra" style="height:130px;width:auto;display:block"></picture></div>
  <h1>Abrindo o seu convite…</h1>
  <p id="msg">Um instante.</p>
  <a class="btn" id="go" href="../">Abrir o Lembra</a>
</main>
<script>
  // o código do convite fica depois do # (nunca vai para servidor nenhum)
  var t = (location.hash || '').replace(/^#\/?/, '').replace(/[^A-Za-z0-9]/g, '');
  var go = document.getElementById('go');
  if (/^[A-Za-z0-9]{32}$/.test(t)) { go.href = '../#/convite/' + t; setTimeout(function () { location.replace(go.href); }, 350); }
  else { document.getElementById('msg').textContent = 'Este link de convite está incompleto. Peça para a pessoa enviar de novo.'; }
</script></body></html>
