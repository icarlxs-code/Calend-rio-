# Servidor gratuito do Calendário (Cloudflare Workers)
# Publicado pelo Cloudflare a partir do GitHub (pasta raiz: worker).
# O armazenamento KV "CAL" é criado automaticamente na primeira publicação.
name = "calend-rio"
main = "src/entry.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

# IA grátis do Cloudflare para o chat do assistente
[ai]
binding = "AI"

# KV antigo: só para a cópia única dos dados para o banco novo (o servidor não grava mais nele)
[[kv_namespaces]]
binding = "CAL"

# Banco do servidor: um Durable Object com SQLite (incluído no plano grátis da Cloudflare)
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
PROJECT_ID = "calendario-48fdb"
ALLOWED_ORIGINS = "https://icarlxs-code.github.io,https://meulembra.com.br,https://www.meulembra.com.br"
# endereço oficial do app (volta do pagamento). Passa para "https://meulembra.com.br/" quando o domínio estiver no ar
SITE_URL = "https://meulembra.com.br/"
TEAM = '[{"id":"henrique","name":"Henrique","email":"icarlxs@gmail.com"},{"id":"matheus","name":"Matheus","email":"contatopedrazzi1@gmail.com"}]'
