# Testes em todo envio. Não usa nenhum segredo e não publica nada.
name: Testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd functions && npm ci && npm test
      - run: npm ci && npm test && npm run build
      - run: cd worker && npm ci && npm test
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p /tmp/regras && cd /tmp/regras && npm init -y && npm i @firebase/rules-unit-testing@4 firebase@11 && npm i -g firebase-tools@14
      - run: RULES_LIB=/tmp/regras firebase emulators:exec --only firestore --project demo-regras "node --test functions/test/firestore-rules.test.js"
