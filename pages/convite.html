<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Convite para o {{APP}}</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Você foi convidado para uma agenda no {{APP}}">
<meta property="og:description" content="Toque para entrar. O convite é pessoal e vale para uma pessoa só.">
<meta property="og:image" content="{{SITE}}media/og-v2.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F4F6">
<link rel="icon" href="../icons/favicon-64.png">
<style>{{STYLE}}</style></head>
<body><main class="center">
  <div class="brandc"><picture><source srcset="../media/marca/completa-branco.png" media="(prefers-color-scheme: dark)"><img class="" src="../media/marca/completa-preto.png" alt="{{APP}}" style="height:130px;width:auto;display:block"></picture></div>
  <h1>Abrindo o seu convite…</h1>
  <p id="msg">Um instante.</p>
  <a class="btn" id="go" href="../">Abrir o {{APP}}</a>
</main>
<script>
  // o código do convite fica depois do # (nunca vai para servidor nenhum)
  var t = (location.hash || '').replace(/^#\/?/, '').replace(/[^A-Za-z0-9]/g, '');
  var go = document.getElementById('go');
  if (/^[A-Za-z0-9]{32}$/.test(t)) { go.href = '../' + (location.search || '') + '#/convite/' + t; setTimeout(function () { location.replace(go.href); }, 350); }
  else { document.getElementById('msg').textContent = 'Este link de convite está incompleto. Peça para a pessoa enviar de novo.'; }
</script></body></html>
